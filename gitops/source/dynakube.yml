apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynakube
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/service/dynatrace/dynakube/
  prune: false
  suspend: false
  targetNamespace: dynatrace
  dependsOn:
    - name: dynatrace-operator
