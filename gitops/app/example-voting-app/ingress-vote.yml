apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: app-vote.com # fake domain name, edit your hosts file and specify the Load Balancer IP for this domain
    http:
      paths:
      - backend:
          service:
            name: vote
            port:
              number: 80
        path: /
        pathType: Prefix
